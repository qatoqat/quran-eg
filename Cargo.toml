[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "3.5"
quran-core = { path = "crates/quran-core" }

# The glyph rasteriser and text shaping are hot even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# `"*"` doesn't cover workspace members; rasterising a page is slow unoptimised.
[profile.dev.package.qcf-glyphs]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
